version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 4
    versioning-strategy: lockfile-only
    allow:
      - dependency-type: all
    commit-message:
      prefix: chore
      include: scope
    groups:
      mcp:
        patterns: [mcp, mcp-types]
      other-dependencies:
        patterns: ["*"]
        exclude-patterns: [telethon, mcp, mcp-types]
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    commit-message:
      prefix: chore
      include: scope
    groups:
      actions:
        patterns: ["*"]
        update-types: [minor, patch]
