version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 4
    versioning-strategy: lockfile-only
    allow:
      - dependency-type: all
    commit-message:
      prefix: chore
      include: scope
    groups:
      mcp:
        patterns: [mcp, mcp-types]
      development-tools:
        patterns: [pytest, pytest-asyncio, pytest-xdist, execnet, ruff, ty]
        update-types: [minor, patch]
      runtime-dependencies:
        patterns: ["*"]
        exclude-patterns:
          [telethon, mcp, mcp-types, pytest, pytest-asyncio, pytest-xdist, execnet, ruff, ty]
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    commit-message:
      prefix: chore
      include: scope
    groups:
      actions:
        patterns: ["*"]
        update-types: [minor, patch]
