name: Bug report
description: Report a reproducible problem with the server or its tools.
body:
  - type: markdown
    attributes:
      value: |
        Use a minimal, synthetic example. Do not include phone numbers, login codes,
        API keys or hashes, session files, credentials, or private Telegram dumps.
  - type: textarea
    id: environment
    attributes:
      label: Versions and environment
      description: Include the project version or commit, Python and uv versions, OS, and MCP client when relevant.
      placeholder: |
        Project version or commit:
        Python:
        uv:
        OS:
        MCP client and version:
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: List the commands or tool arguments needed to reproduce the problem. Use synthetic data and omit secrets.
      placeholder: |
        1.
        2.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include the error code and a short, sanitized diagnostic excerpt if useful.
    validations:
      required: true
