# Copy to the path shown by `telegram-mcp login`, or pass --config explicitly.
# Credentials can instead be supplied through TELEGRAM_API_ID / TELEGRAM_API_HASH.
# api_id = 12345
# api_hash = "your-local-value"
# session_path = "/absolute/private/path/account.session"

# Default: no message access. Folder names are discovered via list_folders or configure.
allowed_folder_ids = []
allowed_chat_ids = []
allow_all_chats = false
# Opt in only for explicitly requested public broadcast channels outside the allowlist.
# Does not widen list_chats, selector-free search, groups, or linked discussions.
allow_public_channel_reads = false
# Independently opt in to public-channel search and similar-channel metadata.
# Discovery never grants permission to read posts or changes the allowlist.
allow_public_channel_discovery = false
# Independently allow one selected attachment up to 20 MiB from a permitted source.
# Downloads expire after 15 minutes; message reads never download attachment bytes.
allow_attachment_downloads = false
# Optional outbound capabilities. All are off by default. Restart after changes.
allow_drafts = false
allow_send_messages = false
allow_send_files = false
allow_bot_callbacks = false
allowed_write_chat_ids = []
# Recipient grants: default is ordinary read access AND an explicit write ID.
# All-chat writes permit sends without a read grant; drafts/callbacks still need reads.
allow_all_write_chats = false
# Outside the write IDs: people/bots only, sends only, always with a confirmation form.
allow_one_off_sends = false
# Independent MCP forms. False permits this action without a form; it does not enable it.
# These policies are local TOML only; there are no MCP, CLI or environment overrides.
require_send_message_confirmation = true
require_send_file_confirmation = true
require_bot_callback_confirmation = true
# Applies to replacing a user-owned/modified draft; revision checks always remain.
require_draft_overwrite_confirmation = true
# Only explicitly selected regular files below these directories may be registered.
# Symlinks/junctions are rejected. Registered copies survive changes to the original.
allowed_upload_directories = []
# Optional permanent copies, only for explicit save=true calls. No automatic deletion.
# Use a dedicated private directory; the server generates filenames inside it.
# archive_directory = "/absolute/private/path/telegram-archive"
# Compact tool advertisements omit output schemas; results remain typed and validated.
# Set "full" for clients that need advertised output schemas, then restart the server.
mcp_schema_mode = "compact"
# IANA time zone for calendar dates in the period_digest prompt.
timezone = "UTC"
rpc_timeout_seconds = 20
max_dialogs = 10000
# Reuse dialog metadata for five minutes, then refresh on demand in the background.
# Folder definitions and authorization are checked on every dependent call.
# TTL 0 disables reuse; stale 0 requires a fresh snapshot after the TTL.
catalog_cache_ttl_seconds = 300
catalog_cache_stale_seconds = 300
rpc_pages_per_call = 12
cursor_ttl_seconds = 900
max_cursors = 128

# Shared local server: telegram-mcp serve --transport http
# Connect MCP applications using telegram-mcp connect. HTTP binds only to 127.0.0.1.
http_port = 8765
# Default: platformdirs user data directory for telegram-mcp, file mcp.token.
# The server creates a private bearer-token file; clients read it locally.
# http_token_path = "/absolute/private/path/mcp.token"
